name: Release gate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Verify clean semantic version tag
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test -z "$(git status --porcelain)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./... -count=1
