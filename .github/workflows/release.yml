name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Verify stable semantic version and source version
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="${GITHUB_REF_NAME#v}"
          grep -Fq "const Version = \"${expected}\"" version.go
          grep -Fq "## [${expected}]" CHANGELOG.md
          test -z "$(git status --porcelain)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -test ./...

  postgres:
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SEVLUMEN_POSTGRES_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - run: go test -race ./integration -count=3 -timeout=10m

  publish:
    needs: [validate, postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Build deterministic source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=tar --prefix="sevlumen-postgres-${version}/" HEAD \
            | gzip -n > "dist/sevlumen-postgres-${version}.tar.gz"
          (cd dist && sha256sum "sevlumen-postgres-${version}.tar.gz" > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Sevlumen PostgreSQL ${GITHUB_REF_NAME}"
